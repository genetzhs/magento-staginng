name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          check-latest: true
          cache: true

      - name: Resolve version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=${TAG} version=${TAG#v}"

      - name: Cross-compile
        env:
          VERSION: ${{ steps.vars.outputs.tag }}
          COMMIT: ${{ steps.vars.outputs.commit }}
          LDFLAGS: -s -w -X main.version=${{ steps.vars.outputs.tag }} -X main.commit=${{ steps.vars.outputs.commit }}
        run: |
          set -e
          mkdir -p bin
          # Linux amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o bin/magento-staging-linux-amd64 .
          # Linux arm64
          CGO_ENABLED=0 GOOS=linux  GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o bin/magento-staging-linux-arm64 .
          # macOS amd64 (Intel)
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o bin/magento-staging-darwin-amd64 .
          # macOS arm64 (Apple Silicon)
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o bin/magento-staging-darwin-arm64 .

          # SHA256 sums
          cd bin
          sha256sum magento-staging-* > checksums.txt
          ls -lh
          cat checksums.txt

      - name: Verify binaries
        run: |
          for f in bin/magento-staging-linux-*; do
            file "$f"
            chmod +x "$f"
            "$f" --help | head -2
          done

      - name: Verify no production identifiers
        env:
          FORBIDDEN_IDENTIFIERS: ${{ vars.FORBIDDEN_IDENTIFIERS }}
        run: |
          if [ -z "$FORBIDDEN_IDENTIFIERS" ]; then
            echo "FORBIDDEN_IDENTIFIERS not set — skipping custom identifier scan"
            exit 0
          fi
          echo "Scanning binaries for forbidden identifiers..."
          IFS=',' read -ra patterns <<< "$FORBIDDEN_IDENTIFIERS"
          found=0
          for f in bin/magento-staging-*; do
            for p in "${patterns[@]}"; do
              p=$(echo "$p" | xargs)
              [ -z "$p" ] && continue
              if strings "$f" | grep -iF -- "$p"; then
                echo "ERROR: forbidden identifier '$p' found in $f"
                found=1
              fi
            done
          done
          if [ "$found" = "1" ]; then exit 1; fi
          echo "All binaries clean of forbidden identifiers"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.vars.outputs.tag, '-') }}
          files: |
            bin/magento-staging-linux-amd64
            bin/magento-staging-linux-arm64
            bin/magento-staging-darwin-amd64
            bin/magento-staging-darwin-arm64
            bin/checksums.txt
